name: bootstrap-task9-staged

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize and verify staged archive
        shell: bash
        run: |
          tr -d '\r\n' < .bootstrap/task9.b64 > /tmp/task9.b64
          test "$(wc -c < /tmp/task9.b64)" -eq 12588
          test "$(sha256sum /tmp/task9.b64 | cut -d' ' -f1)" = "07efb583c5612aca9d3b7b57afa5dc59a798b6718d581586d16442b24e329588"
      - name: Publish portable conformance suite
        run: base64 -d /tmp/task9.b64 | tar -xzf -
      - run: npm ci
      - run: npm run verify
      - name: Commit conformance suite and remove staging files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-task9-staged.yml
          git add -A
          git commit -m "test: define portable runtime conformance suite"
          git push
