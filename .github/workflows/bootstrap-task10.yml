name: bootstrap-task10

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Assemble and verify Task 10 archive
        shell: bash
        run: |
          cat .bootstrap/task10.part00 .bootstrap/task10.part01 .bootstrap/task10.part02 .bootstrap/task10.part03 .bootstrap/task10.part04 | tr -d '\r\n' > /tmp/task10.b64
          test "$(wc -c < /tmp/task10.b64)" -eq 13664
          test "$(sha256sum /tmp/task10.b64 | cut -d' ' -f1)" = "a737948be2b7553c679a85ec70d22585f1b5b2c3aa9869d40d2b4c712c28ef92"
      - name: Publish documentation layer
        run: base64 -d /tmp/task10.b64 | tar -xzf -
      - run: npm ci
      - run: npm run verify
      - name: Commit documentation and remove staging files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-task10.yml
          git add -A
          git commit -m "docs: add platform architecture and decisions"
          git push
