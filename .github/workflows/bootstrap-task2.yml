name: bootstrap-task2

on:
  push:
    branches: [codex/platform-bootstrap]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/platform-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Publish normative standard
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > STANDARD.md
      - name: Install dependencies
        run: npm ci
      - name: Verify Task 2
        run: npm run verify
      - name: Commit standard and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task2.yml
          git add STANDARD.md .github/workflows/bootstrap-task2.yml
          git commit -m "chore: publish normative standard registry"
          git push
