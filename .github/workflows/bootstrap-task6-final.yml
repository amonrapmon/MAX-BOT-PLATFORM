name: bootstrap-task6-final

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Expand Task 6 archive
        shell: bash
        run: |
          archive=$(sed -n "s/.*printf '%s' '\([^']*\)'.*/\1/p" .github/workflows/bootstrap-task6.yml)
          test -n "$archive"
          printf '%s' "$archive" | base64 -d | tar -xzf -
      - name: Install stable validator test
        shell: bash
        run: |
          cat > testing/schemas/schema-validation.test.ts <<'EOF'
          import { readFile } from "node:fs/promises";
          import { createRequire } from "node:module";
          import { join } from "node:path";
          import { Ajv2020 } from "ajv/dist/2020.js";
          import type { FormatsPlugin } from "ajv-formats";
          import { describe, expect, it } from "vitest";

          const require = createRequire(import.meta.url);
          const formatsModule = require("ajv-formats") as
            | FormatsPlugin
            | { default: FormatsPlugin };
          const addFormats: FormatsPlugin =
            typeof formatsModule === "function" ? formatsModule : formatsModule.default;

          async function json(path: string) {
            return JSON.parse(await readFile(join(process.cwd(), path), "utf8"));
          }

          function validator() {
            const ajv = new Ajv2020({ allErrors: true, strict: true });
            addFormats(ajv);
            return ajv;
          }

          describe("platform JSON schemas", () => {
            it("accepts valid event and rejects invalid event", async () => {
              const validate = validator().compile(
                await json("schemas/event-envelope.schema.json"),
              );
              expect(validate(await json("schemas/fixtures/event.valid.json"))).toBe(true);
              expect(validate(await json("schemas/fixtures/event.invalid.json"))).toBe(false);
            });

            it.each([
              ["schemas/outbound-job.schema.json", "schemas/fixtures/outbound-job.valid.json"],
              ["schemas/health-snapshot.schema.json", "schemas/fixtures/health.valid.json"],
              ["schemas/runtime-error.schema.json", "schemas/fixtures/runtime-error.valid.json"],
            ])("validates %s", async (schemaPath, fixturePath) => {
              const validate = validator().compile(await json(schemaPath));
              expect(validate(await json(fixturePath))).toBe(true);
            });
          });
          EOF
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Verify Task 6
        run: npm run verify
      - name: Commit schema layer and remove temporary workflows
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task6.yml
          rm -f .github/workflows/diagnose-task6.yml
          rm -f .github/workflows/bootstrap-task6-fixed.yml
          rm -f .github/workflows/inspect-ajv-types.yml
          rm -f .github/workflows/bootstrap-task6-final.yml
          git add -A
          git commit -m "feat: add versioned platform schemas"
          git push
