name: bootstrap-task6

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Publish schema artifacts
        shell: bash
        run: |
          printf '%s' '' | base64 -d | tar -xzf -
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Verify Task 6
        run: npm run verify
      - name: Commit schema layer and remove bootstrap workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task6.yml
          git add -A
          git commit -m "feat: add versioned platform schemas"
          git push
