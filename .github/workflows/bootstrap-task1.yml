name: bootstrap-task1

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund
      - name: Verify Task 1
        run: npm run verify
      - name: Commit reproducible lockfile and remove bootstrap workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task1.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: lock bootstrap dependencies"
            git push
          fi
