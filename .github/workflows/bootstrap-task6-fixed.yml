name: bootstrap-task6-fixed

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Expand and patch Task 6 archive
        shell: bash
        run: |
          archive=$(sed -n "s/.*printf '%s' '\([^']*\)'.*/\1/p" .github/workflows/bootstrap-task6.yml)
          test -n "$archive"
          printf '%s' "$archive" | base64 -d | tar -xzf -
          python - <<'PY'
          from pathlib import Path
          path = Path('testing/schemas/schema-validation.test.ts')
          text = path.read_text()
          text = text.replace(
              'import Ajv2020 from "ajv/dist/2020.js";\nimport addFormats from "ajv-formats";',
              'import * as Ajv2020Namespace from "ajv/dist/2020.js";\nimport * as addFormatsNamespace from "ajv-formats";',
          )
          text = text.replace(
              'function validator() {\n  const ajv = new Ajv2020({ allErrors: true, strict: true });\n  addFormats(ajv);',
              'function validator() {\n  const Ajv2020 = Ajv2020Namespace.default;\n  const addFormats = addFormatsNamespace.default;\n  const ajv = new Ajv2020({ allErrors: true, strict: true });\n  addFormats(ajv);',
          )
          path.write_text(text)
          PY
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Verify Task 6
        run: npm run verify
      - name: Commit schema layer and remove temporary workflows
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task6.yml
          rm -f .github/workflows/diagnose-task6.yml
          rm -f .github/workflows/bootstrap-task6-fixed.yml
          git add -A
          git commit -m "feat: add versioned platform schemas"
          git push
