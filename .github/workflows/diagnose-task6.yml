name: diagnose-task6

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Expand Task 6 archive from publisher workflow
        shell: bash
        run: |
          archive=$(sed -n "s/.*printf '%s' '\([^']*\)'.*/\1/p" .github/workflows/bootstrap-task6.yml)
          test -n "$archive"
          printf '%s' "$archive" | base64 -d | tar -xzf -
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Full Vitest suite
        run: npm test
      - name: Boundary validation
        run: npm run check:boundaries
      - name: Standard validation
        run: npm run check:standard
      - name: Schema validation
        run: npm run check:schemas
