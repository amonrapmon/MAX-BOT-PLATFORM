name: diagnose-task6

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Expand and patch Task 6 archive
        shell: bash
        run: |
          archive=$(sed -n "s/.*printf '%s' '\([^']*\)'.*/\1/p" .github/workflows/bootstrap-task6.yml)
          test -n "$archive"
          printf '%s' "$archive" | base64 -d | tar -xzf -
          python - <<'PY'
          from pathlib import Path
          path = Path('testing/schemas/schema-validation.test.ts')
          text = path.read_text()
          text = text.replace(
              'import Ajv2020 from "ajv/dist/2020.js";\nimport addFormats from "ajv-formats";',
              'import * as Ajv2020Namespace from "ajv/dist/2020.js";\nimport * as addFormatsNamespace from "ajv-formats";',
          )
          text = text.replace(
              'function validator() {\n  const ajv = new Ajv2020({ allErrors: true, strict: true });\n  addFormats(ajv);',
              'function validator() {\n  const Ajv2020 = Ajv2020Namespace.default;\n  const addFormats = addFormatsNamespace.default;\n  const ajv = new Ajv2020({ allErrors: true, strict: true });\n  addFormats(ajv);',
          )
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task6-typecheck
          path: typecheck.log
      - name: Full Vitest suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task6-vitest
          path: test.log
      - name: Boundary validation
        run: npm run check:boundaries
      - name: Standard validation
        run: npm run check:standard
      - name: Schema validation
        run: npm run check:schemas
