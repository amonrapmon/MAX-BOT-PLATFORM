name: bootstrap-task7

on:
  push:
    branches: [codex/platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Publish Redis registry artifacts
        shell: bash
        run: |
          printf '%s' '' | base64 -d | tar -xzf -
      - run: npm ci
      - run: npm run verify
      - name: Commit Redis registry and remove bootstrap workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap-task7.yml
          git add -A
          git commit -m "docs: define Redis state registry"
          git push
